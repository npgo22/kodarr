# kodarr in-cluster config. Secrets come from kodarr-secret via env
# (KODARR_DB_DSN, KODARR_*_API_KEY, KODARR_QBIT_*, KODARR_WEBHOOK_TOKEN).

[paths]
anime_root = "/data/media/anime"
movie_root = "/data/media/anime-movies"
downloads = "/data/downloads"

[jellyfin]
url = "http://jellyfin.media.svc.cluster.local:8096"

path_from = "/data"
path_to = "/media"

[qbittorrent]
url = "http://qbittorrent.downloads.svc.cluster.local:8080"
category = "kodarr"

[rss]
feeds = ["https://subsplease.org/rss/?r=1080"]
interval = 600

[groups]
preferred = ["SubsPlease"]

[webhook]
port = 7878
