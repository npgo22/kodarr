---
# Encrypt with sops before committing (stub — fill values, then `sops -e -i`).
apiVersion: v1
kind: Secret
metadata:
  name: kodarr-secret
stringData:
  # consumed by the postgres-init initContainer
  INIT_POSTGRES_HOST: postgres-rw.database.svc.cluster.local
  INIT_POSTGRES_DBNAME: kodarr
  INIT_POSTGRES_USER: kodarr
  INIT_POSTGRES_PASS: CHANGEME
  INIT_POSTGRES_SUPER_PASS: CHANGEME
  # consumed by kodarr
  KODARR_DB_DSN: postgresql://kodarr:CHANGEME@postgres-rw.database.svc.cluster.local:5432/kodarr
  KODARR_JELLYFIN_API_KEY: CHANGEME
  KODARR_PROWLARR_API_KEY: CHANGEME
  KODARR_SAB_API_KEY: CHANGEME
  KODARR_QBIT_USER: admin
  KODARR_QBIT_PASS: CHANGEME
  KODARR_WEBHOOK_TOKEN: CHANGEME
  KODARR_TMDB_API_KEY: CHANGEME  # themoviedb.org -> settings -> API (enrichment only: episode titles, stills, backdrops)
