# kodarr configuration. Secrets may instead come from env:
# KODARR_DB_DSN, KODARR_JELLYFIN_API_KEY, KODARR_QBIT_USER, KODARR_QBIT_PASS,
# KODARR_WEBHOOK_TOKEN, KODARR_TMDB_API_KEY

[db]
dsn = "postgresql://kodarr:secret@postgres-rw.database.svc:5432/kodarr"

[paths]
anime_root = "/data/media/anime"
movie_root = "/data/media/anime-movies"
downloads = "/data/downloads"

[jellyfin]
url = "http://jellyfin.media.svc:8096"
api_key = ""

[nyaa]
# url = "https://nyaa.si"

[qbittorrent]
url = "http://qbittorrent.downloads.svc"
user = "admin"
pass = ""
category = "kodarr"

[rss]
feeds = ["https://subsplease.org/rss/?r=1080"]
interval = 600

[groups]
# the release group RSS/backfill grabs; everything else comes via SeaDex
preferred = ["SubsPlease"]

[webhook]
port = 7878
token = ""

[tmdb]
# enrichment only (episode titles, stills, backdrops); structure stays AniList
api_key = ""

